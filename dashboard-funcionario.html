<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bem-vindo - Cuidado Humanizado Batista</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container { max-width: 750px; margin: 0 auto; padding: 20px; width: 100%; }
    header {
      background: #1A5276;
      padding: 15px 20px;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header img { height: 40px; width: auto; }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header h1 span { color: #5DADE2; }
    header small { font-size: 0.6rem; color: #B0C4D0; display: block; }
    
    .welcome-box {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      border-top: 6px solid #2980B9;
      margin-top: 30px;
    }
    
    /* 🔥 MENSAGEM DE BOAS-VINDAS - SEMPRE VISÍVEL */
    .welcome-message {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      color: #2E7D32;
      background: linear-gradient(135deg, #eafaf1, #d5f5e3);
      border: 4px solid #A5D6A7;
      border-radius: 16px;
      padding: 24px 20px;
      margin-bottom: 24px;
      box-shadow: 0 4px 12px rgba(46,125,50,0.15);
    }
    .welcome-message i {
      margin-right: 12px;
      color: #2E7D32;
    }
    
    .loading { text-align: center; padding: 30px; color: #888; }
    .loading i { font-size: 2rem; color: #2980B9; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .info-card {
      background: #f5f7fa;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #2980B9;
      margin-bottom: 12px;
    }
    .info-card label { font-weight: 600; color: #1A5276; font-size: 0.8rem; display: block; text-transform: uppercase; }
    .info-card p { margin: 4px 0 0; font-size: 1rem; }
    
    .btn-sair {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      display: block;
      margin: 20px auto 0;
    }
    .btn-sair:hover { background: #c0392b; }
    
    footer {
      margin-top: auto;
      background: #0A1E2F;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 0.85rem;
    }
    @media (max-width: 600px) {
      .welcome-message { font-size: 1.3rem; padding: 16px; }
      .welcome-box { padding: 20px; }
    }
  </style>
</head>
<body>

<header>
  <img src="https://i.postimg.cc/44HtyBF7/eb74c209-2d52-4f7a-a0ee-88cc4ad9f9d8.jpg" alt="Logo">
  <div>
    <h1>CUIDADO <span>HUMANIZADO</span></h1>
    <small>BATISTA</small>
  </div>
</header>

<div class="container">
  <div class="welcome-box">
    
    <!-- 🔥 MENSAGEM DE BOAS-VINDAS (SEMPRE VISÍVEL) -->
    <div class="welcome-message">
      <i class="fas fa-hand-peace"></i> Bem-vindo ao Cuidado Humanizado Batista!
    </div>

    <!-- Área de carregamento -->
    <div id="loadingArea" class="loading">
      <i class="fas fa-spinner"></i>
      <p>Carregando seus dados...</p>
    </div>

    <!-- Área do perfil (inicialmente oculta) -->
    <div id="perfilArea" style="display:none;">
      <div style="text-align:center; font-size:3rem; color:#2980B9;"><i class="fas fa-user-circle"></i></div>
      <h2 style="text-align:center; color:#1A5276; margin:8px 0;" id="nomeFuncionario">-</h2>
      <p style="text-align:center; color:#888;" id="emailFuncionario">-</p>
      <div id="infoContainer"></div>
      <button class="btn-sair" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</button>
    </div>

    <!-- Área de erro (se houver) -->
    <div id="errorArea" style="display:none; text-align:center; color:#e74c3c; padding:20px;">
      <p>❌ Erro ao carregar seus dados. Tente novamente.</p>
      <button onclick="carregarPerfil()" style="margin-top:10px; padding:6px 16px; background:#2980B9; color:white; border:none; border-radius:4px;">Tentar novamente</button>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 Cuidado Humanizado Batista - Área do Funcionário</p>
</footer>

<script>
const API_URL = 'https://backend-cuidado-humanizado-api.onrender.com';

function verificarAutenticacao() {
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (!token || user.role !== 'funcionario') {
    alert('Você precisa estar logado como funcionário.');
    window.location.href = 'login-funcionario.html';
    return;
  }
  carregarPerfil();
}

async function carregarPerfil() {
  const token = localStorage.getItem('token');
  try {
    const res = await fetch(`${API_URL}/api/funcionarios/me`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!res.ok) throw new Error('Erro ao buscar perfil');
    const dados = await res.json();

    document.getElementById('loadingArea').style.display = 'none';
    document.getElementById('perfilArea').style.display = 'block';
    document.getElementById('errorArea').style.display = 'none';

    document.getElementById('nomeFuncionario').textContent = dados.nomeCompleto || 'Nome não informado';
    document.getElementById('emailFuncionario').textContent = dados.userId?.email || 'Email não informado';

    const container = document.getElementById('infoContainer');
    container.innerHTML = '';

    const infos = [
      { label: '📅 Idade', value: dados.idade ? `${dados.idade} anos` : 'Não informado' },
      { label: '📞 Telefone', value: dados.telefone || 'Não informado' },
      { label: '💼 Especialidade', value: dados.especialidade || 'Não informada' },
      { label: '📝 Descrição', value: dados.descricao || 'Não informada' },
      { label: '🕒 Disponibilidade', value: (() => {
        const disp = [];
        if (dados.disponibilidade?.manha) disp.push('🌅 Manhã');
        if (dados.disponibilidade?.tarde) disp.push('☀️ Tarde');
        if (dados.disponibilidade?.noite) disp.push('🌙 Noite');
        if (dados.disponibilidade?.finaisSemana) disp.push('📅 FDS');
        return disp.length ? disp.join(' / ') : 'Não informado';
      })() }
    ];

    infos.forEach(info => {
      const card = document.createElement('div');
      card.className = 'info-card';
      card.innerHTML = `<label>${info.label}</label><p>${info.value}</p>`;
      container.appendChild(card);
    });

  } catch (err) {
    document.getElementById('loadingArea').style.display = 'none';
    document.getElementById('errorArea').style.display = 'block';
  }
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = 'login-funcionario.html';
}

verificarAutenticacao();
</script>
</body>
</html>
